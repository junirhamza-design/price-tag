      </button>

      <!-- Settings Dialog -->
      <div
        x-show="showSettingsDialog"
        x-cloak
        class="fixed inset-0 z-50 overflow-y-auto"
      >
        <div class="flex items-center justify-center min-h-screen px-4">
          <div
            @click="showSettingsDialog = false"
            class="fixed inset-0 bg-black/30"
          ></div>

          <div
            x-trap.inert.noscroll="showSettingsDialog"
            class="relative bg-white rounded-lg shadow-xl max-w-md w-full p-6"
          >
            <h2 class="text-lg font-semibold text-neutral-900 mb-4">
              Settings
            </h2>

            <div class="flex items-center justify-between mb-6">
              <label class="text-sm font-medium text-neutral-700">
                Disable delete confirmation
              </label>

              <button
                @click="disableDeleteConfirm = !disableDeleteConfirm"
                class="relative inline-flex h-6 w-11 items-center rounded-full transition"
                :class="disableDeleteConfirm ? 'bg-(--primary)' : 'bg-neutral-300'"
              >
                <span
                  class="inline-block h-5 w-5 transform bg-white rounded-full transition"
                  :class="disableDeleteConfirm ? 'translate-x-5' : 'translate-x-1'"
                ></span>
              </button>
            </div>

            <button
              @click="deleteAllProducts()"
              class="w-full inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg:not([class*='size-'])]:size-4 shrink-0 [&_svg]:shrink-0 outline-none focus-visible:border-(--ring) focus-visible:ring-[3px] aria-invalid:ring-(--destructive)/20 dark:aria-invalid:ring-(--destructive)/40 aria-invalid:border-(--destructive) bg-(--destructive) text-white hover:bg-(--destructive)/90 focus-visible:ring-(--destructive)/20 dark:focus-visible:ring-(--destructive)/40 dark:bg-(--destructive)/60 h-9 px-4 py-2 has-[>svg]:px-3"
            >
              Delete All Products
            </button>

            <div class="mt-4 text-right">
              <button
                @click="showSettingsDialog = false"
                class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg text-sm font-medium transition-all disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg:not([class*='size-'])]:size-4 shrink-0 [&_svg]:shrink-0 outline-none focus-visible:border-(--ring) border-(--border) focus-visible:ring-(--ring)/50 focus-visible:ring-[3px] aria-invalid:ring-(--destructive)/20 dark:aria-invalid:ring-(--destructive)/40 aria-invalid:border-(--destructive) border bg-(--background) shadow-xs hover:bg-(--accent) hover:text-(--accent-foreground) dark:bg-(--input)/30 dark:border-(--input) dark:hover:bg-(--input)/50 h-9 px-4 py-2 has-[>svg]:px-3"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>

    <script>
      function productManager() {
        return {
          products: [],
          showCreateDialog: false,
          showEditDialog: false,
          showDeleteDialog: false,
          showSettingsDialog: false,

          disableDeleteConfirm: false,

          createForm: { name: "", mrp: "", arp: "" },
          editForm: { id: null, name: "", mrp: "", arp: "" },
          productToDelete: null,

          init() {
            this.loadProducts();
          },

          loadProducts() {
            const stored = localStorage.getItem("products");
            this.products = stored ? JSON.parse(stored) : [];
          },

          saveProducts() {
            localStorage.setItem("products", JSON.stringify(this.products));
          },

          openCreateDialog() {
            this.createForm = { name: "", mrp: "", arp: "" };
            this.showCreateDialog = true;
          },

          createProduct() {
            this.products.push({
              id: Date.now(),
              name: this.createForm.name,
              mrp: parseFloat(this.createForm.mrp),
              arp: parseFloat(this.createForm.arp),
            });

            this.saveProducts();
            this.showCreateDialog = false;
          },

          openEditDialog(product) {
            this.editForm = { ...product };
            this.showEditDialog = true;
          },

          updateProduct() {
            const index = this.products.findIndex(
              (p) => p.id === this.editForm.id
            );
            if (index !== -1) {
              this.products[index] = {
                ...this.editForm,
                mrp: parseFloat(this.editForm.mrp),
                arp: parseFloat(this.editForm.arp),
              };
              this.saveProducts();
            }
            this.showEditDialog = false;
          },

          confirmDelete(product) {
            this.productToDelete = product;

            if (this.disableDeleteConfirm) {
              this.deleteProduct();
              return;
            }

            this.showDeleteDialog = true;
          },

          deleteProduct() {
            this.products = this.products.filter(
              (p) => p.id !== this.productToDelete.id
            );
            this.saveProducts();
            this.showDeleteDialog = false;
            this.productToDelete = null;
          },

          deleteAllProducts() {
            alert("All products will be deleted permanently.");

            this.products = [];
            this.saveProducts();
          },

          copyCSV() {
            const totalSlots = 12;
            const headers = [];
            const values = [];

            for (let i = 1; i <= totalSlots; i++) {
              headers.push(`productname${i}`, `mrp${i}`, `arp${i}`);
            }

            for (let i = 0; i < totalSlots; i++) {
              if (i < this.products.length) {
                const p = this.products[i];
                values.push(p.name, p.mrp, p.arp);
              } else {
                values.push("Dummy Product Name", "XXX", "XXX");
              }
            }

            const csv = headers.join(",") + "\n" + values.join(",");
            navigator.clipboard.writeText(csv);
            alert("CSV copied to clipboard!");
          },

          downloadTXT() {
            const totalSlots = 12;
            const headers = [];
            const values = [];

            for (let i = 1; i <= totalSlots; i++) {
              headers.push(`productname${i}`, `mrp${i}`, `arp${i}`);
            }

            for (let i = 0; i < totalSlots; i++) {
              if (i < this.products.length) {
                const p = this.products[i];
                values.push(p.name, p.mrp, p.arp);
              } else {
                values.push("Dummy Product Name", "XXX", "XXX");
              }
            }

            const txt = headers.join(",") + "\n" + values.join(",");
            const blob = new Blob([txt], { type: "text/plain" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "products.txt";
            a.click();

            URL.revokeObjectURL(url);
          },
        };
      }
    </script>
  </body>
